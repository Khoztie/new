<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <style>
        /* 1. LAYOUT STYLES */
        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffebee;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden; /* Prevents scrollbars when button moves */
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #e91e63;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }

        h2 {
            color: #ff80ab;
            margin-top: 0;
        }

        /* 2. BUTTON CONTAINER */
        .buttons {
            display: flex;
            justify-content: center;
            gap: 40px;
            position: relative;
            margin-top: 30px;
            min-height: 100px; /* Space for button to move */
        }

        /* 3. BUTTON STYLES */
        button {
            padding: 15px 35px;
            font-size: 1.5rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            /* Smooth transition for returning home and scaling */
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s;
        }

        #yesBtn {
            background: #4caf50;
            color: white;
        }

        #yesBtn:hover {
            background: #388e3c;
            transform: scale(1.1);
        }

        #noBtn {
            background: red;
            color: white;
            position: relative;
            z-index: 10;
        }

        #noBtn:hover {
            background: red;
        }

        img {
            max-width: 200px;
            border-radius: 15px;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Will you be my valentine?</h1>
        <h1>C:</h1>
        
        <img src="mort-madagascar.gif" alt="Cute Mort">
        
        <div class="buttons">
            <button id="yesBtn">Yes </button>
            <button id="noBtn">No </button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        
        // Track the current position of the No button
        let currentX = 0;
        let currentY = 0;

        // --- YES BUTTON REDIRECT ---
        yesBtn.addEventListener('click', () => {
            // This sends the user to your second HTML file
            window.location.href = "yes.html"; 
        });

        // --- NO BUTTON ESCAPE & RETURN LOGIC ---
        document.addEventListener('mousemove', (e) => {
            const btnRect = noBtn.getBoundingClientRect();
            
            // Calculate center of the button
            const btnX = btnRect.left + btnRect.width / 2;
            const btnY = btnRect.top + btnRect.height / 2;

            const mouseX = e.clientX;
            const mouseY = e.clientY;

            // Distance between mouse and button
            const distance = Math.hypot(mouseX - btnX, mouseY - btnY);

            // 1. If mouse gets closer than 130px, move away
            if (distance < 130) {
                const angle = Math.atan2(btnY - mouseY, btnX - mouseX);
                const moveDist = 100; // How far it jumps per move
                
                currentX += Math.cos(angle) * moveDist;
                currentY += Math.sin(angle) * moveDist;

                noBtn.style.transform = `translate(${currentX}px, ${currentY}px)`;
            } 
            
            // 2. If mouse moves far away (350px), reset to original position
            else if (distance > 350) {
                currentX = 0;
                currentY = 0;
                noBtn.style.transform = `translate(0px, 0px)`;
            }
        });
    </script>
</body>
</html>
